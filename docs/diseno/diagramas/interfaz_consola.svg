<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%" style="background:#0f172a; font-family:'Cascadia Code', 'Consolas', monospace;">
  <!-- Título -->
  <text x="425" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#38bdf8">Diseño de la Interfaz de Consola · 4 Escenarios</text>

  <!-- Escenario A -->
  <g transform="translate(30, 60)">
    <rect width="380" height="205" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold">A. Ejecución normal por argumento (RF-07, RF-05)</text>
    <text x="15" y="50" fill="#38bdf8" font-size="11">&gt; dotnet run -- datos/columna1.txt</text>
    <text x="15" y="70" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="85" fill="#f8fafc" font-size="10">PSP0 · Programa 1 — Media y desviación estándar</text>
    <text x="15" y="100" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">Archivo leído : datos/columna1.txt</text>
    <text x="15" y="138" fill="#cbd5e1" font-size="10">Datos (n)     : 10</text>
    <text x="15" y="156" fill="#cbd5e1" font-size="10">Media         : 550.60</text>
    <text x="15" y="174" fill="#cbd5e1" font-size="10">Desv. estándar: 572.03</text>
    <text x="15" y="195" fill="#4ade80" font-size="10">&gt; echo $LASTEXITCODE -&gt; 0</text>
  </g>

  <!-- Escenario B -->
  <g transform="translate(440, 60)">
    <rect width="380" height="205" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold">B. Sin argumento: pide ruta por teclado (RF-07)</text>
    <text x="15" y="50" fill="#38bdf8" font-size="11">&gt; dotnet run</text>
    <text x="15" y="70" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="85" fill="#f8fafc" font-size="10">PSP0 · Programa 1 — Media y desviación estándar</text>
    <text x="15" y="100" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="120" fill="#fbbf24" font-size="10">Ruta del archivo: datos/columna2.txt</text>
    <text x="15" y="138" fill="#cbd5e1" font-size="10">Datos (n)     : 10</text>
    <text x="15" y="156" fill="#cbd5e1" font-size="10">Media         : 60.32</text>
    <text x="15" y="174" fill="#cbd5e1" font-size="10">Desv. estándar: 62.26</text>
    <text x="15" y="195" fill="#4ade80" font-size="10">&gt; echo $LASTEXITCODE -&gt; 0</text>
  </g>

  <!-- Escenario C -->
  <g transform="translate(30, 285)">
    <rect width="380" height="205" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold">C. Dato inválido o archivo no encontrado (RF-06)</text>
    <text x="15" y="50" fill="#38bdf8" font-size="11">&gt; dotnet run -- datos/corrupto.txt</text>
    <text x="15" y="70" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="85" fill="#f8fafc" font-size="10">PSP0 · Programa 1 — Media y desviación estándar</text>
    <text x="15" y="100" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="130" fill="#f87171" font-size="10">ERROR: Línea 3: «abc» no es un número real.</text>
    <text x="15" y="148" fill="#f87171" font-size="10">Use punto decimal (ej. 15.0).</text>
    <text x="15" y="185" fill="#f87171" font-size="10">&gt; echo $LASTEXITCODE -&gt; 1</text>
  </g>

  <!-- Escenario D -->
  <g transform="translate(440, 285)">
    <rect width="380" height="205" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold">D. Un solo dato: desviación no definida (RF-04)</text>
    <text x="15" y="50" fill="#38bdf8" font-size="11">&gt; dotnet run -- datos/uno.txt</text>
    <text x="15" y="70" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="85" fill="#f8fafc" font-size="10">PSP0 · Programa 1 — Media y desviación estándar</text>
    <text x="15" y="100" fill="#64748b" font-size="10">==================================================</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">Archivo leído : datos/uno.txt</text>
    <text x="15" y="138" fill="#cbd5e1" font-size="10">Datos (n)     : 1</text>
    <text x="15" y="156" fill="#cbd5e1" font-size="10">Media         : 42.50</text>
    <text x="15" y="174" fill="#fbbf24" font-size="10">Desv. estándar: no definida (se necesitan al menos 2 datos)</text>
    <text x="15" y="195" fill="#4ade80" font-size="10">&gt; echo $LASTEXITCODE -&gt; 0</text>
  </g>
</svg>
