<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Diagrama de Flujo y Actividad · PSP0 Programa 1</text>
  <text x="350" y="58" text-anchor="middle" font-size="13" fill="#64748b">Caminos de ejecución y control de errores</text>

  <!-- Inicio -->
  <circle cx="350" cy="95" r="14" fill="#0f172a"/>
  
  <line x1="350" y1="109" x2="350" y2="135" stroke="#64748b" stroke-width="2"/>
  
  <!-- Encabezado -->
  <rect x="230" y="135" width="240" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="350" y="158" text-anchor="middle" font-size="12" fill="#1e293b">Mostrar encabezado en consola</text>
  
  <line x1="350" y1="171" x2="350" y2="200" stroke="#64748b" stroke-width="2"/>

  <!-- Rombo: args? -->
  <polygon points="350,200 430,230 350,260 270,230" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">¿Recibe args[0]?</text>

  <!-- Camino No args -->
  <line x1="270" y1="230" x2="160" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="230" x2="160" y2="270" stroke="#64748b" stroke-width="2"/>
  <rect x="90" y="270" width="140" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="160" y="293" text-anchor="middle" font-size="11" fill="#0369a1">Pedir ruta por consola</text>

  <!-- Camino Sí args -->
  <line x1="430" y1="230" x2="540" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="540" y1="230" x2="540" y2="270" stroke="#64748b" stroke-width="2"/>
  <rect x="470" y="270" width="140" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="540" y="293" text-anchor="middle" font-size="11" fill="#0369a1">ruta = args[0]</text>

  <!-- Unión ruta -->
  <line x1="160" y1="306" x2="160" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="540" y1="306" x2="540" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="340" x2="540" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="350" y1="340" x2="350" y2="365" stroke="#64748b" stroke-width="2"/>

  <!-- Abrir y leer archivo -->
  <rect x="240" y="365" width="220" height="36" rx="6" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="350" y="388" text-anchor="middle" font-size="11" fill="#6b21a8">Leer archivo y validar líneas</text>

  <line x1="350" y1="401" x2="350" y2="430" stroke="#64748b" stroke-width="2"/>

  <!-- Rombo: ¿Válido? -->
  <polygon points="350,430 450,460 350,490 250,460" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">¿Archivo y datos válidos?</text>

  <!-- Camino Error -->
  <line x1="450" y1="460" x2="570" y2="460" stroke="#dc2626" stroke-width="2"/>
  <rect x="500" y="490" width="150" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="575" y="508" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">ERROR: Datos inválidos</text>
  <text x="575" y="522" text-anchor="middle" font-size="10" fill="#991b1b">Salir con código 1</text>
  <line x1="570" y1="460" x2="570" y2="490" stroke="#dc2626" stroke-width="2"/>

  <!-- Camino Válido -->
  <line x1="350" y1="490" x2="350" y2="530" stroke="#059669" stroke-width="2"/>
  <rect x="230" y="530" width="240" height="36" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="350" y="552" text-anchor="middle" font-size="11" fill="#065f46">Calcular Media (x̄ = Σx / n)</text>

  <line x1="350" y1="566" x2="350" y2="595" stroke="#64748b" stroke-width="2"/>

  <!-- Rombo: n >= 2? -->
  <polygon points="350,595 430,625 350,655 270,625" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="629" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">¿n &gt;= 2?</text>

  <!-- n < 2 -->
  <line x1="430" y1="625" x2="520" y2="625" stroke="#64748b" stroke-width="2"/>
  <rect x="460" y="650" width="160" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="540" y="672" text-anchor="middle" font-size="10" fill="#475569">Desv: «no definida»</text>

  <!-- n >= 2 -->
  <line x1="350" y1="655" x2="350" y2="690" stroke="#059669" stroke-width="2"/>
  <rect x="210" y="690" width="280" height="36" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="350" y="712" text-anchor="middle" font-size="11" fill="#065f46">Calcular Desviación σ = √(Σ(x-x̄)² / (n-1))</text>

  <!-- Mostrar resultado -->
  <line x1="350" y1="726" x2="350" y2="755" stroke="#64748b" stroke-width="2"/>
  <rect x="220" y="755" width="260" height="36" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="350" y="777" text-anchor="middle" font-size="11" fill="#1e293b">Mostrar n, media, desv · Salir con código 0</text>
</svg>
